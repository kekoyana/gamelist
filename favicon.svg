<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#66c0f4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="rgba(102, 192, 244, 0.3)" stroke-width="1.5"/>

  <!-- Gamepad Body -->
  <g filter="url(#glow)">
    <!-- Controller Base Outline -->
    <path d="M18 20 C13 20, 10 24, 10 32 C10 40, 14 47, 18 47 C21 47, 24 43, 27 39 L37 39 C40 43, 43 47, 46 47 C50 47, 54 40, 54 32 C54 24, 51 20, 46 20 Z" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- D-Pad (Left) -->
    <path d="M18 27 L18 37 M13 32 L23 32" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round"/>

    <!-- Action Buttons (Right) -->
    <circle cx="43" cy="28" r="1.8" fill="#66c0f4"/>
    <circle cx="47" cy="32" r="1.8" fill="#00f0ff"/>
    <circle cx="43" cy="36" r="1.8" fill="#a4d007"/>
    <circle cx="39" cy="32" r="1.8" fill="#f43f5e"/>

    <!-- Center Indicator -->
    <circle cx="32" cy="27" r="1.5" fill="rgba(255,255,255,0.7)"/>
  </g>
</svg>
