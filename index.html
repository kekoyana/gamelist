<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kekoyana ゲームライブラリ</title>
<meta name="description" content="kekoyanaが制作したブラウザゲームコレクション。Steamライブラリ風の快適なUIですぐにプレイ。">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   STEAM LIBRARY DESIGN SYSTEM
   ========================================================================== */
:root {
  --steam-bg-darkest: #0e141b;
  --steam-bg-dark: #171a21;
  --steam-bg-main: #1b2838;
  --steam-bg-card: #16202d;
  --steam-bg-hover: #213346;
  --steam-bg-selected: #2a475e;
  
  --steam-border: rgba(255, 255, 255, 0.08);
  --steam-border-focus: #66c0f4;
  
  --steam-blue-light: #66c0f4;
  --steam-blue-mid: #417a9b;
  
  --steam-green-btn-start: #75b022;
  --steam-green-btn-end: #588a1b;
  --steam-green-btn-hover-start: #8ed629;
  --steam-green-btn-hover-end: #6aa621;
  
  --steam-text-light: #c7d5e0;
  --steam-text-dim: #8f98a0;
  --steam-text-dark: #626366;
  --steam-text-white: #ffffff;
  
  --steam-warning-bg: rgba(245, 158, 11, 0.12);
  --steam-warning-border: rgba(245, 158, 11, 0.35);
  --steam-warning-text: #fbbf24;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: "Motiva Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--steam-bg-darkest);
  color: var(--steam-text-light);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  font-size: 14px;
}

/* ==========================================================================
   STEAM CLIENT TOP BAR
   ========================================================================== */
.client-topbar {
  background-color: var(--steam-bg-dark);
  border-bottom: 1px solid var(--steam-border);
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 50;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}

.topbar-logo {
  font-size: 18px;
}

.topbar-title {
  color: var(--steam-text-white);
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.topbar-nav {
  display: flex;
  gap: 16px;
}

.nav-tab-item {
  color: var(--steam-text-white);
  font-size: 13px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.08);
  border: none;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.library-count-badge {
  font-size: 12px;
  color: var(--steam-blue-light);
  background: rgba(102, 192, 244, 0.12);
  padding: 4px 12px;
  border-radius: 12px;
  font-weight: 700;
  border: 1px solid rgba(102, 192, 244, 0.25);
}

/* ==========================================================================
   MAIN STEAM LIBRARY LAYOUT (SPLIT VIEW)
   ========================================================================== */
.library-layout {
  display: flex;
  flex: 1;
  min-height: calc(100vh - 48px);
  background-color: var(--steam-bg-main);
}

/* --- LEFT SIDEBAR (GAME LIST) --- */
.library-sidebar {
  width: 290px;
  background-color: var(--steam-bg-dark);
  border-right: 1px solid rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-search-box {
  padding: 12px;
  border-bottom: 1px solid var(--steam-border);
}

.sidebar-search-input {
  width: 100%;
  background-color: #212b35;
  border: 1px solid rgba(0, 0, 0, 0.6);
  border-radius: 3px;
  color: #fff;
  padding: 7px 10px 7px 28px;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}

.sidebar-search-input:focus {
  border-color: var(--steam-blue-light);
  background-color: #2a3847;
}

.search-wrapper {
  position: relative;
}

.search-icon-svg {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--steam-text-dim);
  font-size: 11px;
  pointer-events: none;
}

.sidebar-category-filter {
  display: flex;
  gap: 4px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--steam-border);
  overflow-x: auto;
  scrollbar-width: none;
}
.sidebar-category-filter::-webkit-scrollbar { display: none; }

.cat-pill {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--steam-text-dim);
  border: none;
  cursor: pointer;
  white-space: nowrap;
  font-weight: 500;
  transition: all 0.15s;
}

.cat-pill:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
}

.cat-pill.active {
  background: var(--steam-blue-light);
  color: #000;
  font-weight: 700;
}

.sidebar-gamelist {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  cursor: pointer;
  color: var(--steam-text-light);
  transition: background 0.15s ease;
  user-select: none;
}

.sidebar-item:hover {
  background-color: rgba(255, 255, 255, 0.06);
  color: #fff;
}

.sidebar-item.active {
  background: linear-gradient(90deg, #2a475e 0%, rgba(42, 71, 94, 0.3) 100%);
  color: #fff;
  border-left: 3px solid var(--steam-blue-light);
  padding-left: 11px;
}

.sidebar-item-icon {
  font-size: 18px;
  width: 22px;
  text-align: center;
  flex-shrink: 0;
}

.sidebar-item-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

.sidebar-item-name {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-item-cat {
  font-size: 10px;
  color: var(--steam-text-dark);
}

.sidebar-item.active .sidebar-item-cat {
  color: var(--steam-blue-light);
}

/* --- RIGHT MAIN DETAIL VIEW --- */
.library-main {
  flex: 1;
  background-color: var(--steam-bg-main);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* HERO HEADER (SELECTED GAME BANNER) */
.hero-banner {
  position: relative;
  min-height: 420px;
  background-color: #0b0f15;
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  border-bottom: 1px solid rgba(0, 0, 0, 0.6);
  overflow: hidden;
  transition: background-image 0.3s ease;
}

.hero-banner-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    0deg,
    rgba(27, 40, 56, 1) 0%,
    rgba(27, 40, 56, 0.88) 35%,
    rgba(14, 20, 27, 0.45) 100%
  );
}

.hero-banner-content {
  position: relative;
  z-index: 5;
  padding: 30px 40px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.hero-tags-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.hero-tag {
  background: rgba(0, 0, 0, 0.65);
  color: var(--steam-blue-light);
  border: 1px solid rgba(102, 192, 244, 0.3);
  padding: 3px 8px;
  font-size: 11px;
  border-radius: 2px;
  font-weight: 500;
}

.hero-title {
  font-size: 34px;
  font-weight: 900;
  color: #fff;
  line-height: 1.15;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
}

.hero-tagline {
  font-size: 14px;
  color: var(--steam-text-light);
  max-width: 680px;
  line-height: 1.5;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

/* BIG GREEN PLAY BUTTON & META BAR */
.hero-action-bar {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.btn-steam-play {
  background: linear-gradient(to right, var(--steam-green-btn-start) 5%, var(--steam-green-btn-end) 95%);
  color: #ffffff;
  padding: 12px 42px;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.05em;
  border-radius: 3px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  transition: all 0.15s ease;
}

.btn-steam-play:hover {
  background: linear-gradient(to right, var(--steam-green-btn-hover-start) 5%, var(--steam-green-btn-hover-end) 95%);
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(117, 176, 34, 0.4);
}

.hero-meta-stats {
  display: flex;
  gap: 24px;
}

.stat-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-label {
  font-size: 10px;
  color: var(--steam-text-dark);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.stat-value {
  font-size: 13px;
  color: var(--steam-text-light);
  font-weight: 600;
}

/* GAME DETAILS / ABOUT SECTION */
.library-content-body {
  padding: 30px 40px 60px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.detail-section-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--steam-text-dim);
  font-weight: 700;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--steam-border);
  padding-bottom: 6px;
}

/* Notice Box for Download / Bandwidth */
.notice-box {
  background: var(--steam-warning-bg);
  border: 1px solid var(--steam-warning-border);
  border-radius: 4px;
  padding: 12px 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
}

.notice-icon {
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 1px;
}

.notice-text {
  font-size: 12px;
  color: var(--steam-warning-text);
  line-height: 1.5;
  font-weight: 500;
}

.game-about-box {
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--steam-border);
  border-radius: 3px;
  padding: 20px;
  line-height: 1.6;
  color: #c7d5e0;
}

.game-about-box p {
  margin-bottom: 12px;
}

.features-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  margin-top: 14px;
}

.feature-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  padding: 12px;
  border-radius: 3px;
  display: flex;
  gap: 10px;
}

.feature-bullet {
  color: var(--steam-blue-light);
  font-weight: 700;
}

.feature-text {
  font-size: 12px;
  color: var(--steam-text-light);
  line-height: 1.45;
}

/* SCREENSHOTS GALLERY SECTION (STEAM-STYLE) */
.screenshots-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}

.screenshot-thumb-card {
  aspect-ratio: 16 / 9;
  background-color: #0b0f15;
  border: 1px solid var(--steam-border);
  border-radius: 3px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: all 0.2s ease;
}

.screenshot-thumb-card:hover {
  border-color: var(--steam-blue-light);
  transform: translateY(-3px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6), 0 0 10px rgba(102, 192, 244, 0.3);
}

.screenshot-thumb-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.screenshot-thumb-card:hover .screenshot-thumb-img {
  transform: scale(1.05);
}

.screenshot-badge {
  position: absolute;
  bottom: 6px;
  left: 6px;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 2px;
  font-weight: 600;
  pointer-events: none;
}

/* ALL GAMES COLLECTION SHELF (BOTTOM GRID) */
.shelf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px;
}

.shelf-card {
  background: var(--steam-bg-card);
  border: 1px solid var(--steam-border);
  border-radius: 3px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
}

.shelf-card:hover {
  transform: translateY(-4px);
  border-color: var(--steam-blue-light);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
}

.shelf-card.active {
  border-color: var(--steam-blue-light);
  box-shadow: 0 0 12px rgba(102, 192, 244, 0.35);
}

.shelf-media {
  aspect-ratio: 16 / 9;
  background-color: #0b0f15;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.shelf-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.shelf-card:hover .shelf-img {
  transform: scale(1.06);
}

.shelf-body {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: linear-gradient(180deg, #16202d 0%, #0e141b 100%);
}

.shelf-title {
  font-size: 13px;
  font-weight: 700;
  color: #c7d5e0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.shelf-card:hover .shelf-title {
  color: #fff;
}

.shelf-category {
  font-size: 10px;
  color: var(--steam-text-dim);
}

/* ==========================================================================
   SCREENSHOT LIGHTBOX MODAL
   ========================================================================== */
.lightbox-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.lightbox-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.lightbox-content {
  position: relative;
  max-width: 1100px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.lightbox-img {
  max-width: 100%;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 4px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
  border: 1px solid var(--steam-border);
}

.lightbox-caption {
  margin-top: 12px;
  color: var(--steam-text-light);
  font-size: 13px;
  font-weight: 600;
}

.lightbox-close-btn {
  position: absolute;
  top: -40px;
  right: 0;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
}

/* ==========================================================================
   RESPONSIVE DESIGN
   ========================================================================== */
@media (max-width: 800px) {
  .library-layout {
    flex-direction: column;
  }
  .library-sidebar {
    width: 100%;
    max-height: 240px;
    border-right: none;
    border-bottom: 1px solid var(--steam-border);
  }
  .hero-banner-content {
    padding: 20px;
  }
  .hero-title {
    font-size: 24px;
  }
  .library-content-body {
    padding: 20px;
  }
  .screenshots-gallery-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<!-- STEAM CLIENT TOP BAR -->
<header class="client-topbar">
  <div class="topbar-left">
    <a href="#" class="topbar-brand" id="brandReset">
      <span class="topbar-logo">🎮</span>
      <span class="topbar-title">kekoyana Games</span>
    </a>

    <div class="topbar-nav">
      <button class="nav-tab-item active" id="tabAll">ライブラリ</button>
    </div>
  </div>

  <div class="topbar-right">
    <span class="library-count-badge">8 本のゲーム</span>
  </div>
</header>

<!-- MAIN LIBRARY SPLIT VIEW -->
<div class="library-layout">

  <!-- LEFT SIDEBAR: SEARCH, FILTERS & GAME LIST -->
  <aside class="library-sidebar">
    <div class="sidebar-search-box">
      <div class="search-wrapper">
        <span class="search-icon-svg">🔍</span>
        <input 
          type="text" 
          class="sidebar-search-input" 
          id="searchInput" 
          placeholder="ゲームを検索..." 
          autocomplete="off"
        >
      </div>
    </div>

    <!-- Category Pills -->
    <div class="sidebar-category-filter" id="categoryPills">
      <button class="cat-pill active" data-cat="all">すべて (8)</button>
      <button class="cat-pill" data-cat="strategy">戦略・カード (4)</button>
      <button class="cat-pill" data-cat="action">3D脱出 (1)</button>
      <button class="cat-pill" data-cat="simulation">シム (2)</button>
      <button class="cat-pill" data-cat="quiz">クイズ (1)</button>
    </div>

    <!-- Game List Items -->
    <div class="sidebar-gamelist" id="sidebarGamelist">
      <!-- Items dynamically injected -->
    </div>
  </aside>

  <!-- RIGHT MAIN DETAIL AREA (SELECTED GAME) -->
  <main class="library-main">

    <!-- HERO BANNER (OGP优先、なければキャプチャ) -->
    <section class="hero-banner" id="heroBanner">
      <div class="hero-banner-gradient"></div>
      <div class="hero-banner-content">
        <div class="hero-tags-row" id="heroTags">
          <!-- Tags injected -->
        </div>
        <h1 class="hero-title" id="heroTitle">Cyber Ward</h1>
        <p class="hero-tagline" id="heroTagline">
          異常を見つけて引き返せ。サイバー空間を探索し第8ファイアウォールを目指す3Dサイバー脱出ゲーム。
        </p>

        <!-- Big Play Button & Stats Bar -->
        <div class="hero-action-bar">
          <a class="btn-steam-play" id="heroPlayBtn" href="https://cyber-ward.pages.dev/" target="_blank" rel="noopener">
            <span>▶</span> プレイ
          </a>

          <div class="hero-meta-stats">
            <div class="stat-item">
              <span class="stat-label">想定プレイ時間</span>
              <span class="stat-value" id="heroPlaytime">15〜25分</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">プラットフォーム</span>
              <span class="stat-value" id="heroPlatform">ブラウザ（PC / スマホ）</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">開発元</span>
              <span class="stat-value">kekoyana</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- DETAILS, SCREENSHOTS & SHELF -->
    <div class="library-content-body">

      <!-- Notice Container (Rendered dynamically if game has notice) -->
      <div id="noticeContainer"></div>

      <!-- About Section -->
      <div>
        <div class="detail-section-title">ゲームについて</div>
        <div class="game-about-box">
          <p id="heroFullDesc">
            サイバー空間の深層ネットワークに迷い込んだプレイヤー。エリア内の微細なバグを見極め、引き返すか進むかを判断して第8ファイアウォールの突破を目指します。
          </p>
          <div class="features-list" id="heroFeaturesList">
            <!-- Features injected -->
          </div>
        </div>
      </div>

      <!-- SCREENSHOTS GALLERY SECTION -->
      <div>
        <div class="detail-section-title">スクリーンショット</div>
        <div class="screenshots-gallery-grid" id="screenshotsGallery">
          <!-- Screenshots injected -->
        </div>
      </div>

      <!-- All Games Collection Shelf -->
      <div>
        <div class="detail-section-title">すべてのコレクション (8)</div>
        <div class="shelf-grid" id="shelfGrid">
          <!-- Shelf Cards injected -->
        </div>
      </div>

    </div>

  </main>

</div>

<!-- SCREENSHOT LIGHTBOX MODAL -->
<div class="lightbox-overlay" id="lightboxModal" role="dialog" aria-modal="true">
  <div class="lightbox-content">
    <button class="lightbox-close-btn" id="lightboxCloseBtn" aria-label="閉じる">✕</button>
    <img src="" alt="" class="lightbox-img" id="lightboxImg">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

// --- STATE ---
let selectedGameId = GAMES[0].id;
let currentCategory = "all";
let searchQuery = "";

// --- DOM ELEMENTS ---
const sidebarGamelist = document.getElementById("sidebarGamelist");
const categoryPills = document.getElementById("categoryPills");
const searchInput = document.getElementById("searchInput");
const shelfGrid = document.getElementById("shelfGrid");
const screenshotsGallery = document.getElementById("screenshotsGallery");
const noticeContainer = document.getElementById("noticeContainer");

// Hero Elements
const heroBanner = document.getElementById("heroBanner");
const heroTags = document.getElementById("heroTags");
const heroTitle = document.getElementById("heroTitle");
const heroTagline = document.getElementById("heroTagline");
const heroPlayBtn = document.getElementById("heroPlayBtn");
const heroPlaytime = document.getElementById("heroPlaytime");
const heroPlatform = document.getElementById("heroPlatform");
const heroFullDesc = document.getElementById("heroFullDesc");
const heroFeaturesList = document.getElementById("heroFeaturesList");

// Lightbox Elements
const lightboxModal = document.getElementById("lightboxModal");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxCaption = document.getElementById("lightboxCaption");
const lightboxCloseBtn = document.getElementById("lightboxCloseBtn");

// --- RENDER FUNCTIONS ---
function selectGame(gameId) {
  selectedGameId = gameId;
  const game = GAMES.find(g => g.id === gameId);
  if (!game) return;

  // Update Hero Banner (Cover Art)
  heroTitle.textContent = game.title;
  heroTagline.textContent = game.summary;
  heroPlayBtn.href = game.url;
  heroPlaytime.textContent = game.playtime;
  heroPlatform.textContent = game.platform;
  heroFullDesc.textContent = game.desc;
  heroBanner.style.backgroundImage = `url(${game.coverImg})`;

  // Notice Bar
  if (game.notice) {
    noticeContainer.innerHTML = `
      <div class="notice-box">
        <span class="notice-icon">⚠️</span>
        <span class="notice-text">${game.notice}</span>
      </div>
    `;
  } else {
    noticeContainer.innerHTML = '';
  }

  // Tags
  heroTags.innerHTML = game.tags.map(t => 
    `<span class="hero-tag">${t}</span>`
  ).join('');

  // Features List
  heroFeaturesList.innerHTML = game.features.map(f => `
    <div class="feature-card">
      <span class="feature-bullet">✔</span>
      <span class="feature-text">${f}</span>
    </div>
  `).join('');

  // Screenshots Gallery
  screenshotsGallery.innerHTML = game.screenshots.map(s => `
    <div class="screenshot-thumb-card" data-src="${s.src}" data-label="${s.label}">
      <img src="${s.src}" alt="${s.label}" class="screenshot-thumb-img" loading="lazy" />
      <span class="screenshot-badge">${s.label}</span>
    </div>
  `).join('');

  // Attach Lightbox Triggers
  document.querySelectorAll('.screenshot-thumb-card').forEach(card => {
    card.addEventListener('click', () => {
      openLightbox(card.dataset.src, card.dataset.label);
    });
  });

  // Update Sidebar & Shelf Active States
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.classList.toggle('active', item.dataset.id === gameId);
  });

  document.querySelectorAll('.shelf-card').forEach(card => {
    card.classList.toggle('active', card.dataset.id === gameId);
  });
}

function renderSidebar() {
  const filtered = GAMES.filter(game => {
    if (currentCategory !== "all" && game.category !== currentCategory) {
      return false;
    }
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      const matchTitle = game.title.toLowerCase().includes(q);
      const matchTags = game.tags.some(t => t.toLowerCase().includes(q));
      if (!matchTitle && !matchTags) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    sidebarGamelist.innerHTML = `
      <div style="padding: 20px 14px; color: var(--steam-text-dark); font-size: 12px; text-align: center;">
        該当なし
      </div>
    `;
    return;
  }

  sidebarGamelist.innerHTML = filtered.map(game => `
    <div 
      class="sidebar-item ${game.id === selectedGameId ? 'active' : ''}" 
      data-id="${game.id}"
    >
      <span class="sidebar-item-icon">${game.icon}</span>
      <div class="sidebar-item-info">
        <span class="sidebar-item-name">${game.title}</span>
        <span class="sidebar-item-cat">${game.categoryLabel}</span>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', () => {
      selectGame(item.dataset.id);
    });
  });
}

function renderShelf() {
  shelfGrid.innerHTML = GAMES.map(game => `
    <div class="shelf-card ${game.id === selectedGameId ? 'active' : ''}" data-id="${game.id}">
      <div class="shelf-media">
        <img src="${game.coverImg}" alt="${game.title}" class="shelf-img" loading="lazy" />
      </div>
      <div class="shelf-body">
        <div class="shelf-title">${game.title}</div>
        <div class="shelf-category">${game.categoryLabel} ・ ${game.playtime}</div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.shelf-card').forEach(card => {
    card.addEventListener('click', () => {
      selectGame(card.dataset.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

// --- LIGHTBOX FUNCTIONS ---
function openLightbox(src, label) {
  lightboxImg.src = src;
  lightboxCaption.textContent = label;
  lightboxModal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightboxModal.classList.remove('active');
  document.body.style.overflow = '';
}

lightboxCloseBtn.addEventListener('click', closeLightbox);
lightboxModal.addEventListener('click', (e) => {
  if (e.target === lightboxModal) closeLightbox();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightboxModal.classList.contains('active')) {
    closeLightbox();
  }
});

// --- EVENT LISTENERS ---
categoryPills.addEventListener('click', (e) => {
  const pill = e.target.closest('.cat-pill');
  if (!pill) return;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  currentCategory = pill.dataset.cat;
  renderSidebar();
});

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderSidebar();
});

document.getElementById('brandReset').addEventListener('click', (e) => {
  e.preventDefault();
  currentCategory = "all";
  searchQuery = "";
  searchInput.value = "";
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.toggle('active', p.dataset.cat === 'all'));
  renderSidebar();
  selectGame(GAMES[0].id);
});

// --- INITIALIZE ---
renderSidebar();
renderShelf();
selectGame(GAMES[0].id);
</script>
